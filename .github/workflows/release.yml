name: Build & Release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxcursor-dev libudev-dev libfreetype-dev \
            libopenal-dev libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Configure (Linux/Windows)
        if: runner.os != 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          mkdir -p stage/PurpleHell
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/Release/PurpleHell.exe stage/PurpleHell/
            # OpenAL e LGPL, precisa ser dll dinamica junto do exe
            cp build/_deps/sfml-src/extlibs/bin/x64/openal32.dll stage/PurpleHell/
          else
            cp build/PurpleHell stage/PurpleHell/
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R build/_deps/sfml-src/extlibs/libs-osx/Frameworks stage/PurpleHell/Frameworks
          fi
          cp -r PurpleHell/res stage/PurpleHell/res

          cd stage
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../PurpleHell-${{ matrix.name }}.zip PurpleHell
          else
            tar czf ../PurpleHell-${{ matrix.name }}.tar.gz PurpleHell
          fi

      - name: Inspect binary dependencies (macOS)
        if: runner.os == 'macOS'
        run: otool -L stage/PurpleHell/PurpleHell

      - uses: actions/upload-artifact@v4
        with:
          name: PurpleHell-${{ matrix.name }}
          path: PurpleHell-${{ matrix.name }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: PurpleHell-*
